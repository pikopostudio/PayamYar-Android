name: Build PayamYar Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          echo "SDK path: $ANDROID_HOME"
          echo "sdkmanager: $(command -v sdkmanager)"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PayamYar-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
